{% extends "base.html" %}
{% block title %}Reset password · {{ APP_NAME }}{% endblock %}
{% block content %}
<section class="auth-card">
  <div><p class="eyebrow">Account recovery</p><h1>Reset your password</h1><p class="muted">Enter the email address associated with your staff account.</p></div>
  <form method="post" class="stacked-form">{% csrf_token %}{{ form.as_p }}<button class="button primary" type="submit">Send reset email</button></form>
</section>
{% endblock %}
